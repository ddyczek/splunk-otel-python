component: Splunk Distribution of OpenTelemetry Python
version: 1.0.0
dependencies:
  - name: OpenTelemetry Api
    version: 1.35.0
    source_href: https://github.com/open-telemetry/opentelemetry-python
    stability: stable
  - name: OpenTelemetry Sdk
    version: 1.35.0
    source_href: https://github.com/open-telemetry/opentelemetry-python
    stability: stable
  - name: OpenTelemetry Propagator B3
    version: 1.35.0
    source_href: https://github.com/open-telemetry/opentelemetry-python
    stability: stable
  - name: OpenTelemetry Exporter Otlp Proto Grpc
    version: 1.35.0
    source_href: https://github.com/open-telemetry/opentelemetry-python
    stability: stable
  - name: OpenTelemetry Exporter Otlp Proto Http
    version: 1.35.0
    source_href: https://github.com/open-telemetry/opentelemetry-python
    stability: stable
  - name: OpenTelemetry Instrumentation
    version: 0.56b0
    source_href: https://github.com/open-telemetry/opentelemetry-python
    stability: experimental
  - name: OpenTelemetry Instrumentation System Metrics
    version: 0.56b0
    source_href: https://github.com/open-telemetry/opentelemetry-python
    stability: experimental
  - name: OpenTelemetry Semantic Conventions
    version: 0.56b0
    source_href: https://github.com/open-telemetry/opentelemetry-python
    stability: experimental
instrumentations:
  - keys:
      - aio_pika
    instrumented_components:
      - name: AioPika
        supported_versions: varies
    stability: stable
    support: official
    signals:
      - spans:
          - span_name: Messaging {operation}
            kind: consumer
            attributes:
              - messaging.system
              - messaging.destination
              - messaging.message_id
              - messaging.conversation_id
              - net.peer.name
              - net.peer.port
  - keys:
      - aiohttp_client
    instrumented_components:
      - name: AioHttpClient
        supported_versions: varies
    stability: stable
    support: official
    signals:
      - spans:
          - span_name: HTTP {request.method}
            kind: client
            attributes:
              - http.method
              - http.scheme
              - http.host
              - http.target
              - http.status_code
              - http.flavor
              - net.peer.name
              - net.peer.port
              - http.url
  - keys:
      - aiohttp_server
    instrumented_components:
      - name: AioHttpServer
        supported_versions: varies
    stability: stable
    support: official
    signals:
      - spans:
          - span_name: HTTP {request.method}
            kind: server
            attributes:
              - http.method
              - http.scheme
              - http.host
              - http.target
              - http.server_name
              - http.status_code
              - http.flavor
              - net.host.port
              - net.host.name
              - http.route
  - keys:
      - aiokafka
    instrumented_components:
      - name: AIOKafka
        supported_versions: varies
    stability: stable
    support: official
    signals:
      - spans:
          - span_name: Kafka {operation} {topic}
            kind: consumer
            attributes:
              - messaging.system
              - messaging.kafka.message.key
              - messaging.destination.name
              - messaging.destination.partition.id
              - messaging.kafka.message.offset
              - messaging.client.id
              - server.address
              - messaging.operation.name
              - messaging.operation.type
  - keys:
      - aiopg
    instrumented_components:
      - name: Aiopg
        supported_versions: varies
    stability: stable
    support: official
    signals:
      - spans:
          - span_name: SQL {query}
            kind: client
            attributes:
              - db.system
              - db.name
              - db.user
              - db.statement
              - db.connection_string
              - net.peer.name
              - net.peer.port
  - keys:
      - asgi
    instrumented_components:
      - name: ASGI
        supported_versions: varies
    stability: stable
    support: official
    signals:
      - spans:
          - span_name: HTTP {request.method}
            kind: SERVER
            attributes:
              - http.method
              - http.scheme
              - http.host
              - http.target
              - http.server_name
              - http.status_code
              - http.flavor
              - net.host.port
              - net.host.name
              - http.route
  - keys:
      - asyncclick
    instrumented_components:
